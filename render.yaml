services:
  - type: web
    name: knit-rimy-site
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_TO
        sync: false
      - key: MAIL_FROM
        sync: false
